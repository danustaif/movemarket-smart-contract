[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/", "forge-std/=lib/forge-std/src/"]
# Deploy.s.sol membaca alamat forwarder dari SOT dan menulis deployments/
fs_permissions = [
  { access = "read", path = "../source/sot/constants.json" },
  { access = "read-write", path = "./deployments" },
]

[invariant]
runs = 128
depth = 128
fail_on_revert = true # aksi handler tidak boleh revert; assert di handler ikut dihitung

[lint]
# lockTime dan resolveDeadline memang berbasis block.timestamp (CONTRACTS.md 3)
exclude_lints = ["block-timestamp"]
